name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Android platform
        run: |
          npm install @capacitor/android
          npx cap add android || true
          npx cap sync android

      # توليد الأيقونات من assets/icon.png
      - name: Generate Android Icons
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update minSdkVersion to 24
        run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle || true

      - name: Force Compatible AndroidX Core Version
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'androidx.core:core:1.15.0'" >> android/app/build.gradle
          echo "        force 'androidx.core:core-ktx:1.15.0'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      # Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # Release APK
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
